name: macOS build and release

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cueglass-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-package:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report toolchain
        run: |
          xcodebuild -version
          xcrun swift --version

      - name: Test CueFlowCore
        run: swift test --package-path Packages/CueFlowCore --scratch-path "$RUNNER_TEMP/CueGlassCore"

      - name: Test native app
        run: scripts/test-app.sh

      - name: Check Swift formatting
        run: >-
          xcrun swift-format lint --strict --recursive
          CueFlow Packages/CueFlowCore/Sources Packages/CueFlowCore/Tests
          CueFlowTests scripts/make-fixtures.swift Packages/CueFlowCore/Package.swift

      - name: Build universal app without a Developer ID signature
        run: |
          xcodebuild \
            -project CueFlow.xcodeproj \
            -scheme CueFlow \
            -configuration ReleaseLocal \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/CueGlassReleaseDerivedData" \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package and verify release assets
        id: package
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            label="$GITHUB_REF_NAME"
            if [[ ! "$label" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][[:alnum:].-]+)?$ ]]; then
              echo "Release tag must use vMAJOR.MINOR.PATCH: $label" >&2
              exit 1
            fi
          else
            label="build-${GITHUB_SHA:0:12}"
          fi

          app_path="$RUNNER_TEMP/CueGlassReleaseDerivedData/Build/Products/ReleaseLocal/CueFlow.app"
          app_executable="$app_path/Contents/MacOS/CueFlow"
          if [[ ! -d "$app_path" || ! -x "$app_executable" ]]; then
            echo "Expected built app at $app_path" >&2
            exit 1
          fi
          lipo "$app_executable" -verify_arch arm64
          lipo "$app_executable" -verify_arch x86_64

          dist_dir="$RUNNER_TEMP/CueGlassReleaseAssets"
          mkdir -p "$dist_dir"
          archive_name="CueGlass-${label}-macOS-UNSIGNED-UNNOTARIZED.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$dist_dir/$archive_name"
          (
            cd "$dist_dir"
            shasum -a 256 "$archive_name" > "$archive_name.sha256"
            shasum -a 256 --check "$archive_name.sha256"
            unzip -t "$archive_name"
          )

          cat > "$dist_dir/UNNOTARIZED.txt" <<'NOTICE'
          CueGlass local MVP build

          This app is unsigned and has not been notarized. Apple Developer account
          integration, signing, and notarization are deferred to a later milestone.
          macOS Gatekeeper may prevent this build from opening. A signed and notarized
          release will be provided after that work is complete.
          NOTICE

          cat > "$RUNNER_TEMP/CueGlassReleaseNotice.md" <<'NOTICE'
          **This build is unsigned and not notarized.** Apple Developer account
          integration, signing, and notarization are deferred to a later milestone.
          macOS Gatekeeper may prevent this build from opening. A signed and notarized
          release will be provided after that work is complete.
          NOTICE

          cp "$RUNNER_TEMP/CueGlassReleaseNotice.md" "$dist_dir/RELEASE_NOTES.md"

          echo "archive_name=$archive_name" >> "$GITHUB_OUTPUT"
          echo "dist_dir=$dist_dir" >> "$GITHUB_OUTPUT"

      - name: Upload version-tag assets for publishing
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cueglass-release-assets
          path: |
            ${{ steps.package.outputs.dist_dir }}/${{ steps.package.outputs.archive_name }}
            ${{ steps.package.outputs.dist_dir }}/${{ steps.package.outputs.archive_name }}.sha256
            ${{ steps.package.outputs.dist_dir }}/UNNOTARIZED.txt
            ${{ steps.package.outputs.dist_dir }}/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 1

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cueglass-release-assets
          path: ${{ runner.temp }}/CueGlassReleaseAssets

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          DIST_DIR: ${{ runner.temp }}/CueGlassReleaseAssets
          ARCHIVE_NAME: CueGlass-${{ github.ref_name }}-macOS-UNSIGNED-UNNOTARIZED.zip
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            "$DIST_DIR/$ARCHIVE_NAME" \
            "$DIST_DIR/$ARCHIVE_NAME.sha256" \
            "$DIST_DIR/UNNOTARIZED.txt" \
            --verify-tag \
            --prerelease \
            --latest=false \
            --title "CueGlass $GITHUB_REF_NAME (UNSIGNED / UNNOTARIZED)" \
            --generate-notes \
            --notes-file "$DIST_DIR/RELEASE_NOTES.md"
